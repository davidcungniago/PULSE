name: Verifikasi Pulse

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff format --check backend/app backend/tests backend/scripts backend/alembic
      - run: python -m ruff check backend/app backend/tests backend/scripts
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: backend
      - name: Validasi migrasi database kosong
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-verification.db
        run: python -m alembic upgrade head
      - name: Build image backend
        run: docker build -t pulse-verification ./backend

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --concurrency=1 --reporter expanded
      - run: flutter build web --no-wasm-dry-run --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-web-demo-local
          path: build/web
          retention-days: 7

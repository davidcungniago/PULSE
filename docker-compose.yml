x-backend-environment: &backend-environment
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Pulse}
  JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  CORS_ORIGIN_REGEX: ""
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

x-backend-common: &backend-common
  build: ./backend
  ports:
    - "127.0.0.1:8000:8000"
  command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    interval: 10s
    timeout: 6s
    retries: 5

services:
  backend:
    <<: *backend-common
    environment:
      <<: *backend-environment
      DATABASE_URL: sqlite:////data/pulse.db
    volumes:
      - pulse_sqlite:/data

  db:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: pulse
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-postgres:
    <<: *backend-common
    profiles: ["postgres"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+psycopg2://pulse:${POSTGRES_PASSWORD:-}@db:5432/pulse

volumes:
  pulse_sqlite:
  pulse_pgdata:
